plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    // Ship source + javadoc jars so Java consumers get IDE navigation and inline docs.
    withSourcesJar()
    withJavadocJar()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless GameTest harness. `./gradlew runGameTestServer` boots a minimal server,
        // runs every @GameTest in this mod's namespace, and exits 0 on all-pass / non-zero
        // on any failure. The gametest classes + their structure template live in src/main
        // (so this run picks them up from build/classes) but are excluded from the published
        // jar (see the `jar` task below) — the shipped library carries no test payload.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Put Minecraft + NeoForge on the test classpath and load this mod in a minimal FML
    // environment, so unit tests can bootstrap registries and exercise real codecs.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // worldgen library: no external mod dependencies in v0.1
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Keep the GameTest harness out of every published jar. The tests run from
// build/classes during `runGameTestServer`, but the shipped library must stay a pure
// worldgen library — no test classes, no test structure template. The sources jar
// archives allSource (java + resources), so it needs the same excludes as the main jar;
// withSourcesJar()/withJavadocJar() do not inherit the main jar's filters.
def testPayloadExcludes = { CopySpec spec ->
    spec.exclude 'com/kuronami/isekaiapi/gametest/**'
    spec.exclude 'data/isekai_api/structure/**'
}
tasks.named('jar', Jar) { testPayloadExcludes(it) }
tasks.named('sourcesJar', Jar) { testPayloadExcludes(it) }

// Consumers only ever touch the api/ package — everything else is @ApiStatus.Internal.
// Scope javadoc (and thus the javadoc jar) to api/ only: this keeps the published docs
// to the supported surface and keeps the GameTest sources out of the doc pass. The full
// compile classpath stays available so api/ signatures referencing Mojang/NeoForge types
// resolve. External -link is left off (offline, and Mojang publishes no javadoc).
tasks.named('javadoc', Javadoc) {
    source = sourceSets.main.allJava.matching {
        include 'com/kuronami/isekaiapi/api/**'
    }
    options.encoding = 'UTF-8'
    // all doclint checks (broken {@link}, malformed HTML, bad references) except
    // "missing" — a public worldgen library does not carry a @param for every record
    // component; class- and method-level prose carries the contract instead.
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

// Distribution as a GitHub raw-URL maven repo: `./gradlew publish` writes the standard
// maven layout into `maven/` (git-ignored here; W5 commits it to the repo's `maven` branch,
// which consumers reference by raw URL — public, no auth, no account setup). Consumers add
// isekai_api as a compileOnly dependency and bring their own NeoForge, so the published pom
// must carry no dependencies: NeoForge/Minecraft are provided by the consumer's own toolchain,
// never resolved transitively from ours. Gradle module metadata is disabled for the same
// reason — it would re-introduce the moddev-managed neoforge coordinate that consumers can't
// resolve from a plain maven repo.
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
            pom.withXml {
                def deps = asNode().dependencies
                if (deps) { deps.replaceNode {} }
            }
            pom {
                name = mod_name
                description = mod_description
                url = 'https://github.com/KURONAMI333/isekai-api'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/KURONAMI333/isekai-api/blob/main/LICENSE'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'localRaw'
            url = uri(layout.projectDirectory.dir('maven'))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
